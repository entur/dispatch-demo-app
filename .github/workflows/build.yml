name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "tests pass"

  trigger-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: entur/dispatch-relay/.github/actions/dispatch@060971479766910213969dd45cd08e6da6b796de
        with:
          target: henrik242/dispatch-demo-app-deployment-config
          relay-url: ${{ vars.DISPATCH_RELAY_URL }}
