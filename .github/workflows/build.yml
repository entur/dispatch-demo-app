name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "tests pass"

  trigger-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: entur/dispatch-relay@686fcba7f2383962fc8bc974b94c3395d11c4f0e
        with:
          target: henrik242/dispatch-demo-deploy
          relay-url: ${{ vars.DISPATCH_RELAY_URL }}
