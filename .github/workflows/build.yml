name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "tests pass"

  trigger-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'henrik242'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      RELAY_URL: ${{ vars.DISPATCH_RELAY_URL }}
    steps:
      - shell: bash # pipefail, so a failed curl fails the step
        run: |
          jwt=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=entur-dispatch-relay" | jq -r .value)
          curl -sSf -X POST -H "Authorization: Bearer $jwt" -H "User-Agent: entur-dispatch-$GITHUB_REPOSITORY" \
            -d '{"target":"henrik242/dispatch-demo-deploy","workflow":"deploy.yml"}' \
            "$RELAY_URL/v1/dispatch" | jq -r '"Deploy run: \(.run_url)"' >> "$GITHUB_STEP_SUMMARY"
